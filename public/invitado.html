<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¿Este carro lleva GLP?</title>
<!--
  Consulta pública para PDI. Se abre en mi-dominio/invitado.

  Por qué existe: se estaban despachando carros al cliente sin GLP. Quien
  usa esta pantalla no tiene cuenta en el sistema ni la va a tener, así que
  es una página suelta — no carga la PWA, no pide sesión, no guarda nada.

  Diseño: un veredicto enorme y legible a un metro, con color. La persona
  está de pie junto al carro decidiendo si lo suelta o no; el detalle de las
  etapas va debajo, para quien quiera saber por qué.

  El texto de cada veredicto vive en el servidor (routes/invitado.js), no
  aquí: es lo que alguien lee para frenar un despacho y quiero poder
  corregirlo sin tocar esta página.
-->
<script src="https://unpkg.com/html5-qrcode" defer></script>
<style>
  :root {
    --bg0: #0c0e11; --surface: #1e232b; --line: rgba(255,255,255,.12);
    --text: #e9eaec; --muted: rgba(233,234,236,.58);
    --ok: #22c55e; --warn: #f59e0b; --danger: #f87171; --duda: #94a3b8;
    --font: ui-rounded, Quicksand, Nunito, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg0);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 22px 16px calc(22px + env(safe-area-inset-bottom));
  }
  header { text-align: center; }
  h1 { font-size: 20px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 14px; font-weight: 600; margin-top: 4px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    width: min(94vw, 460px);
    display: grid;
    gap: 12px;
  }

  input {
    width: 100%;
    background: #12161c;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px;
    color: var(--text);
    font: 700 18px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .06em;
    padding: 14px 16px;
    text-align: center;
    text-transform: uppercase;
  }
  input:focus { outline: 2px solid var(--ok); outline-offset: 1px; }

  button {
    font: 800 16px var(--font);
    border-radius: 12px;
    border: 1px solid transparent;
    padding: 14px 16px;
    cursor: pointer;
    color: #0c0e11;
    background: var(--ok);
  }
  button:disabled { opacity: .45; cursor: default; }
  .btnGhost {
    background: transparent;
    color: var(--text);
    border-color: rgba(255,255,255,.2);
  }
  .fila { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

  /* ── Lector ── */
  #lector { width: 100%; border-radius: 12px; overflow: hidden; display: none; }
  body.escaneando #lector { display: block; }
  body.escaneando #bloqueManual { display: none; }

  /* ── Veredicto ── */
  #resultado { display: none; width: min(94vw, 460px); }
  body.conResultado #resultado { display: grid; gap: 12px; }

  .veredicto {
    border-radius: 18px;
    padding: 22px 18px;
    text-align: center;
    display: grid;
    gap: 8px;
    border: 2px solid;
  }
  .veredicto .vin {
    font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .08em;
    opacity: .7;
  }
  .veredicto .titulo { font-size: 30px; font-weight: 900; line-height: 1.05; }
  .veredicto .detalle { font-size: 15px; font-weight: 600; line-height: 1.4; opacity: .92; }

  /* El color lo pone el tono que manda el servidor. Fondo tenue + borde y
     texto saturados: en el taller hay sol de frente y un relleno saturado
     con texto oscuro se lava; así el contraste aguanta. */
  .veredicto.ok     { border-color: var(--ok);     background: rgba(34,197,94,.12);  color: var(--ok); }
  .veredicto.warn   { border-color: var(--warn);   background: rgba(245,158,11,.12); color: var(--warn); }
  .veredicto.danger { border-color: var(--danger); background: rgba(248,113,113,.14); color: var(--danger); }
  .veredicto.duda   { border-color: var(--duda);   background: rgba(148,163,184,.12); color: var(--duda); }

  .etapas { display: grid; gap: 8px; }
  .etapa {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 700;
  }
  .etapa span:first-child { color: var(--muted); font-weight: 600; }

  .aviso { color: var(--muted); font-size: 13px; font-weight: 600; text-align: center; min-height: 18px; }
  .aviso.error { color: var(--danger); }
  footer { color: var(--muted); font-size: 12px; font-weight: 600; text-align: center; max-width: 460px; }

  /* ── Selector de modo ── */
  .modos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: min(94vw, 460px); }
  .modoBtn {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--line);
    font-size: 15px;
    padding: 11px 10px;
  }
  .modoBtn.activo { background: var(--ok); color: #0c0e11; border-color: var(--ok); }

  body.modoLista #bloqueUno,   body.modoLista #resultado      { display: none !important; }
  body.modoUno   #bloqueLista, body.modoUno   #resultadoLista { display: none !important; }

  textarea {
    width: 100%;
    min-height: 130px;
    resize: vertical;
    background: #12161c;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px;
    color: var(--text);
    font: 600 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 12px 14px;
    text-transform: uppercase;
  }
  textarea:focus { outline: 2px solid var(--ok); outline-offset: 1px; }

  /* ── Resultado de lista ── */
  #resultadoLista { display: none; width: min(94vw, 460px); gap: 10px; }
  body.conLista #resultadoLista { display: grid; }

  .resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .resumenTile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
    display: grid;
    gap: 3px;
  }
  .resumenNum { font-size: 26px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .resumenLbl { font-size: 11px; font-weight: 700; color: var(--muted); }
  .resumenTile.malo  { border-color: var(--danger); background: rgba(248,113,113,.12); }
  .resumenTile.malo  .resumenNum { color: var(--danger); }
  .resumenTile.duda  .resumenNum { color: var(--duda); }
  .resumenTile.bueno .resumenNum { color: var(--ok); }

  .filaVin {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 10px;
    align-items: baseline;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid;
    border-radius: 10px;
    padding: 10px 12px;
  }
  .filaVin .fVin {
    font: 700 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .04em;
  }
  .filaVin .fTit  { font-size: 13px; font-weight: 800; text-align: right; }
  .filaVin .fSub  { grid-column: 1 / -1; font-size: 12px; font-weight: 600; color: var(--muted); }
  .filaVin.ok     { border-left-color: var(--ok); }
  .filaVin.ok     .fTit { color: var(--ok); }
  .filaVin.warn   { border-left-color: var(--warn); }
  .filaVin.warn   .fTit { color: var(--warn); }
  .filaVin.danger { border-left-color: var(--danger); }
  .filaVin.danger .fTit { color: var(--danger); }
  .filaVin.duda   { border-left-color: var(--duda); }
  .filaVin.duda   .fTit { color: var(--duda); }

  .grupoTit {
    font-size: 12px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .04em;
    margin-top: 4px;
  }
</style>
</head>
<body class="modoUno">

<header>
  <h1>¿Este carro lleva GLP?</h1>
  <div class="sub">Escanee el VIN o escríbalo antes de despachar</div>
</header>

<div class="modos">
  <button class="modoBtn activo" id="btnModoUno"   type="button">Un carro</button>
  <button class="modoBtn"        id="btnModoLista" type="button">Pegar lista</button>
</div>

<div class="card">
  <div id="lector"></div>

  <div id="bloqueUno">
    <div id="bloqueManual" style="display:grid;gap:12px;">
      <input id="vin" type="text" inputmode="latin" autocomplete="off" autocapitalize="characters"
             spellcheck="false" placeholder="VIN" maxlength="17" aria-label="VIN del vehículo">
      <div class="fila">
        <button id="btnConsultar" disabled>Consultar</button>
        <button id="btnEscanear" class="btnGhost" type="button">📷 Escanear</button>
      </div>
    </div>
  </div>

  <div id="bloqueLista" style="display:grid;gap:12px;">
    <textarea id="vinsLista" spellcheck="false" aria-label="Lista de VINs"
      placeholder="Pegue aquí los VIN, uno por línea.&#10;Da igual si vienen con comas, tabulaciones o texto de más."></textarea>
    <button id="btnConsultarLista" type="button">Consultar lista</button>
  </div>

  <button id="btnCerrarLector" class="btnGhost" type="button" style="display:none;">✕ Cerrar cámara</button>
  <div class="aviso" id="aviso"></div>
</div>

<div id="resultadoLista"></div>

<div id="resultado">
  <div class="veredicto" id="veredicto">
    <span class="vin" id="rVin"></span>
    <span class="titulo" id="rTitulo"></span>
    <span class="detalle" id="rDetalle"></span>
  </div>
  <div class="etapas">
    <div class="etapa"><span>Conversión</span><span id="rConv">—</span></div>
    <div class="etapa"><span>Revisión técnica</span><span id="rCal">—</span></div>
  </div>
  <button id="btnOtro" class="btnGhost" type="button">Consultar otro carro</button>
</div>

<footer>
  Ante cualquier duda, consulte con el área de GLP antes de despachar.
</footer>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);

  // El VIN real tiene 17 caracteres y nunca usa I, O ni Q (se confunden con
  // 1 y 0). Se acepta desde 11 porque algunas etiquetas del taller llevan el
  // VIN corto; el servidor valida con la misma regla.
  const VIN_RE = /^[A-HJ-NPR-Z0-9]{11,17}$/;

  function limpiar_(txt) {
    return String(txt || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
  }

  function aviso_(msg, esError) {
    const el = $("aviso");
    el.textContent = msg || "";
    el.classList.toggle("error", !!esError);
  }

  async function consultar_(vinCrudo) {
    const vin = limpiar_(vinCrudo);
    if (!VIN_RE.test(vin)) {
      aviso_("Ese VIN no parece válido. Revise que estén los 17 caracteres.", true);
      return;
    }
    aviso_("Consultando…");
    $("btnConsultar").disabled = true;
    try {
      const r = await fetch("/api/invitado/vin/" + encodeURIComponent(vin), { cache: "no-store" });
      const d = await r.json();
      if (!d || !d.ok) throw new Error(d && d.error ? d.error : "No se pudo consultar.");
      pintar_(d);
      aviso_("");
    } catch (e) {
      aviso_(e.message || "Sin conexión. Intente de nuevo.", true);
    } finally {
      $("btnConsultar").disabled = false;
    }
  }

  function pintar_(d) {
    $("rVin").textContent     = d.vin || "";
    $("rTitulo").textContent  = d.titulo || "";
    $("rDetalle").textContent = d.detalle || "";
    $("veredicto").className  = "veredicto " + (d.tono || "duda");
    $("rConv").textContent    = d.etapas ? d.etapas.conversion : "—";
    $("rCal").textContent     = d.etapas ? d.etapas.calidad    : "—";
    document.body.classList.add("conResultado");
    $("resultado").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // ── Entrada manual ──
  $("vin").addEventListener("input", function () {
    const v = limpiar_(this.value);
    if (this.value !== v) this.value = v;
    $("btnConsultar").disabled = !VIN_RE.test(v);
    // Un lector Bluetooth escribe el VIN entero de golpe y termina con Enter,
    // pero algunos no mandan Enter: al llegar a 17 se consulta solo.
    if (v.length === 17) consultar_(v);
  });
  $("vin").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); consultar_($("vin").value); }
  });
  $("btnConsultar").addEventListener("click", () => consultar_($("vin").value));
  $("btnOtro").addEventListener("click", () => {
    document.body.classList.remove("conResultado");
    $("vin").value = "";
    $("btnConsultar").disabled = true;
    $("vin").focus();
  });

  // ── Modo ──
  function setModo_(modo) {
    document.body.classList.toggle("modoUno",   modo === "uno");
    document.body.classList.toggle("modoLista", modo === "lista");
    $("btnModoUno").classList.toggle("activo",   modo === "uno");
    $("btnModoLista").classList.toggle("activo", modo === "lista");
    aviso_("");
    if (modo === "lista") cerrarLector_();
  }
  $("btnModoUno").addEventListener("click",   () => setModo_("uno"));
  $("btnModoLista").addEventListener("click", () => setModo_("lista"));

  // ── Lista pegada ──

  /**
   * Saca los VIN de un texto pegado de cualquier sitio.
   *
   * Se trocea por todo lo que no sea alfanumérico, así da igual si la lista
   * viene de un Excel (tabulaciones), de un correo (comas, viñetas) o con una
   * cabecera de más: cada trozo se juzga por separado y el servidor descarta
   * lo que no sea un VIN.
   */
  function extraerVins_(texto) {
    return String(texto || "")
      .split(/[^A-Za-z0-9]+/)
      .map(t => t.toUpperCase())
      .filter(Boolean);
  }

  async function consultarLista_() {
    const vins = extraerVins_($("vinsLista").value);
    if (!vins.length) {
      aviso_("Pegue al menos un VIN.", true);
      return;
    }
    aviso_("Consultando " + vins.length + "…");
    $("btnConsultarLista").disabled = true;
    try {
      const r = await fetch("/api/invitado/lote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vins: vins }),
      });
      const d = await r.json();
      if (!d || !d.ok) throw new Error(d && d.error ? d.error : "No se pudo consultar.");
      pintarLista_(d);
      aviso_("");
    } catch (e) {
      aviso_(e.message || "Sin conexión. Intente de nuevo.", true);
    } finally {
      $("btnConsultarLista").disabled = false;
    }
  }

  // Peor primero. Quien pega 40 carros busca los que NO pueden salir; que
  // tenga que bajar por 36 verdes para encontrar los 4 rojos sería al revés
  // de lo que necesita.
  var ORDEN_TONO = { danger: 0, warn: 1, duda: 2, ok: 3 };

  function pintarLista_(d) {
    // Sin `??` a propósito: esta página no pasa por el transpilador de Vite y
    // se abre en teléfonos viejos del taller, donde ese operador no existe.
    var peso_ = function (t) { return ORDEN_TONO[t] === undefined ? 9 : ORDEN_TONO[t]; };
    var filas = (d.resultados || []).slice().sort(function (a, b) {
      return peso_(a.tono) - peso_(b.tono);
    });

    var html =
      '<div class="resumen">' +
        '<div class="resumenTile malo"><span class="resumenNum">' + d.frenan + '</span>' +
          '<span class="resumenLbl">NO PUEDEN SALIR</span></div>' +
        '<div class="resumenTile duda"><span class="resumenNum">' + d.dudosos + '</span>' +
          '<span class="resumenLbl">POR CONFIRMAR</span></div>' +
        '<div class="resumenTile bueno"><span class="resumenNum">' + d.pueden + '</span>' +
          '<span class="resumenLbl">PUEDEN SALIR</span></div>' +
      '</div>';

    if (d.invalidos && d.invalidos.length) {
      html += '<div class="grupoTit">No se consultaron (' + d.invalidos.length +
              '): no parecen VIN — ' + d.invalidos.map(escapar_).join(", ") + '</div>';
    }

    html += filas.map(function (r) {
      return '<div class="filaVin ' + r.tono + '">' +
        '<span class="fVin">' + escapar_(r.vin) + '</span>' +
        '<span class="fTit">' + escapar_(r.titulo) + '</span>' +
        '<span class="fSub">Conversión: ' + escapar_(r.etapas.conversion) +
          ' · Revisión: ' + escapar_(r.etapas.calidad) + '</span>' +
      '</div>';
    }).join("");

    $("resultadoLista").innerHTML = html;
    document.body.classList.add("conLista");
  }

  // El servidor solo manda texto suyo y VINs ya filtrados, pero esto se pinta
  // con innerHTML: se escapa igual, para que un cambio de arriba no se
  // convierta en un agujero aquí abajo.
  function escapar_(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  $("btnConsultarLista").addEventListener("click", consultarLista_);

  // ── Cámara ──
  // html5-qrcode llega por <script defer> desde unpkg. Si la red del taller
  // lo bloquea, el botón se desactiva y la entrada manual sigue funcionando:
  // esta pantalla no puede quedarse inservible por un CDN.
  let lector = null;

  async function abrirLector_() {
    if (typeof Html5Qrcode === "undefined") {
      aviso_("El lector no está disponible. Escriba el VIN a mano.", true);
      return;
    }
    document.body.classList.add("escaneando");
    $("btnCerrarLector").style.display = "block";
    aviso_("Apunte al código del parabrisas.");
    try {
      lector = new Html5Qrcode("lector", {
        // El VIN del carro viene en código de barras, no en QR, pero algunas
        // etiquetas del taller sí son QR. Se aceptan los dos para que nadie
        // tenga que saber cuál le tocó.
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.QR_CODE,
        ],
        // No existe en Safari/WebKit y rompe el lector en iPhone.
        experimentalFeatures: { useBarCodeDetectorIfSupported: false },
      });
      await lector.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
        texto => { cerrarLector_(); $("vin").value = limpiar_(texto); consultar_(texto); },
        () => {}   // fallo de lectura por frame: es lo normal, no se reporta
      );
    } catch (e) {
      cerrarLector_();
      aviso_("No se pudo abrir la cámara. Escriba el VIN a mano.", true);
    }
  }

  function cerrarLector_() {
    document.body.classList.remove("escaneando");
    $("btnCerrarLector").style.display = "none";
    aviso_("");
    if (lector) {
      const l = lector;
      lector = null;
      l.stop().then(() => l.clear()).catch(() => {});
    }
  }

  $("btnEscanear").addEventListener("click", abrirLector_);
  $("btnCerrarLector").addEventListener("click", cerrarLector_);

  // ?vin=XXXX consulta directa: sirve para pegar el link de un carro concreto.
  const pre = new URLSearchParams(location.search).get("vin");
  if (pre) { $("vin").value = limpiar_(pre); consultar_(pre); }
})();
</script>
</body>
</html>
