<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 14px; max-width: 560px; background:#fff; }
    .row { margin: 10px 0; }
    label { display:block; font-size: 12px; color:#444; margin-bottom:6px; }
    input, select, textarea { width: 100%; padding: 10px; border:1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { padding: 10px 12px; border:1px solid #ccc; border-radius: 10px; cursor:pointer; background:#f6f6f6; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .status { padding: 10px; border-radius: 10px; background:#f7f7f7; font-size: 13px; }
    .ok { color:#0a7; }
    .err { color:#c00; }
    .small { font-size:12px; color:#666; }
  </style>
</head>

<body>
  <div class="card">
    <h3 style="margin:0 0 10px 0;">Control de Trabajo GLP</h3>

    <div id="banner" class="status">Cargando perfil...</div>

    <div class="row">
      <h4 style="margin:8px 0;">Mis conversiones activas</h4>
      <div id="cards" class="row"></div>
    </div>

    <hr>

    <div class="row">
      <label>VIN / CHASIS</label>
      <input id="vin" placeholder="VIN o QR" autocomplete="off">
      <div class="grid" style="margin-top:6px;">
        <button id="btnBuscar" type="button">🔍 Buscar VIN</button>
        <button id="btnQR" type="button">📷 Escanear QR</button>
      </div>
      <div id="vinHelp" class="small"></div>
      <div id="qr-reader" style="display:none;margin-top:10px;"></div>
    </div>

    <div class="row">
      <button id="btnEnsure" type="button" disabled>Crear / Obtener Conversión</button>
    </div>

    <div class="row">
      <label>Rol</label>
      <select id="rol" disabled>
        <option value="">Selecciona…</option>
        <option value="MOTOR">MOTOR</option>
        <option value="TANQUE">TANQUE</option>
      </select>
      <div id="rolHelp" class="small"></div>
    </div>

    <div class="row">
      <label>Nota</label>
      <textarea id="nota" rows="2" placeholder="Ej: pausa por almuerzo..."></textarea>
    </div>

    <div class="row grid">
      <button id="btnInicio" type="button" disabled>INICIAR</button>
      <button id="btnPausa" type="button" disabled>PAUSAR</button>
      <button id="btnReanudar" type="button" disabled>REANUDAR</button>
      <button id="btnFin" type="button" disabled>FINALIZAR</button>
    </div>

    <div id="timer" class="status">Tiempo: 00:00:00</div>
    <div id="log" class="status"></div>
  </div>

<script>
  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);

  const elBanner = $("banner");
  const elCards  = $("cards");
  const elVin    = $("vin");
  const elVinHelp= $("vinHelp");
  const elQrBox  = $("qr-reader");

  const elEnsure = $("btnEnsure");
  const elBuscar = $("btnBuscar");
  const elQR     = $("btnQR");

  const elRol    = $("rol");
  const elRolHelp= $("rolHelp");
  const elNota   = $("nota");

  const bInicio  = $("btnInicio");
  const bPausa   = $("btnPausa");
  const bRean    = $("btnReanudar");
  const bFin     = $("btnFin");

  const elTimer  = $("timer");
  const elLog    = $("log");

  // ---------- STATE ----------
  let PROFILE = null;
  let VIN_OK = false;
  let CONVERSION_ID = null;

  let UI_TIMER = null;
  let UI_BASE_MS = 0;
  let UI_RUNNING_SINCE_MS = null;

  let qr = null;

  // ---------- HELPERS ----------
  function gasRun(fn,arg){
    return new Promise((res,rej)=>{
      const r=google.script.run
        .withSuccessHandler(res)
        .withFailureHandler(e=>{
          console.log("GAS ERROR", e);
          alert("GAS ERROR: " + (e.message || e));
          rej(e);
        });
      arg===undefined?r[fn]():r[fn](arg);
    });
  }


  function setBanner(text, cls=""){
    elBanner.className = "status " + cls;
    elBanner.textContent = text;
  }
  function setLog(text, cls=""){
    elLog.className = "status " + cls;
    elLog.textContent = text;
  }

  function normalizeVin(v){ return String(v||"").trim().toUpperCase(); }

  function fmt(ms){
    ms = Math.max(0, Number(ms)||0);
    const s = Math.floor(ms/1000);
    const hh = String(Math.floor(s/3600)).padStart(2,'0');
    const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    return `${hh}:${mm}:${ss}`;
  }

  function stopTimer(){
    if (UI_TIMER) clearInterval(UI_TIMER);
    UI_TIMER = null;
    UI_RUNNING_SINCE_MS = null;
  }

  function setButtonsByEstado(estado){
    [bInicio,bPausa,bRean,bFin].forEach(b => b.disabled = true);
    if (!VIN_OK || !CONVERSION_ID || !elRol.value) return;

    if (estado === "SIN_INICIAR") bInicio.disabled = false;
    if (estado === "TRABAJANDO") { bPausa.disabled = false; bFin.disabled = false; }
    if (estado === "PAUSADO")    { bRean.disabled = false; bFin.disabled = false; }
  }

  // ---------- PROFILE ----------
  async function loadProfile(){
    try{
      const r = await gasRun("api_me");
      if (!r || r.ok === false) throw new Error(r?.error || "No se pudo cargar perfil.");
      PROFILE = r;
      setBanner(`Sesión: ${r.email} | Especialidad: ${r.especialidad}`, "ok");
      elRol.disabled = false;
    }catch(e){
      setBanner("Error cargando perfil: " + e.message, "err");
    }
  }

  // ---------- VIN FLOW ----------
  async function buscarVin(){
    try{
      VIN_OK = false;
      CONVERSION_ID = null;
      elEnsure.disabled = true;
      stopTimer();
      setLog("", "");

      const v = normalizeVin(elVin.value);
      if (!v){
        elVinHelp.textContent = "Escribe un VIN.";
        elVinHelp.className = "small err";
        return;
      }

      elVin.value = v;
      elVinHelp.textContent = "Buscando VIN...";
      elVinHelp.className = "small";

      const r = await gasRun("api_checkVin", v);
      if (!r || r.ok === false) throw new Error(r?.error || "Error al validar VIN.");

      if (!r.exists){
        elVinHelp.textContent = "VIN no existe en LISTA DE VIN GLP.";
        elVinHelp.className = "small err";
        return;
      }

      VIN_OK = true;
      elVinHelp.textContent = "VIN válido ✅. Ahora puedes crear/obtener conversión.";
      elVinHelp.className = "small ok";
      elEnsure.disabled = false;

    }catch(e){
      elVinHelp.textContent = "Error: " + e.message;
      elVinHelp.className = "small err";
    }
  }

  async function asegurarConversion(){
    try{
      if (!VIN_OK) return setLog("Primero valida el VIN con Buscar VIN.", "err");

      const v = normalizeVin(elVin.value);
      const r = await gasRun("api_ensure", v);
      if (!r || r.ok === false) throw new Error(r?.error || "No se pudo asegurar conversión.");

      CONVERSION_ID = r.conversionId;
      setLog("Conversión lista ✅", "ok");

      await refrescarEstado();
    }catch(e){
      setLog("Error: " + e.message, "err");
    }
  }

  async function enviarAccion(accion){
    try{
      const v = normalizeVin(elVin.value);
      const rol = String(elRol.value||"").trim().toUpperCase();
      const nota = elNota.value || "";

      if (!VIN_OK) return setLog("Primero valida el VIN con Buscar VIN.", "err");
      if (!CONVERSION_ID) return setLog("Primero presiona Crear/Obtener Conversión.", "err");
      if (!rol) return setLog("Selecciona un rol.", "err");

      const r = await gasRun("api_evento", { vin: v, rolTrabajo: rol, accion, nota });
      if (!r || r.ok === false) throw new Error(r?.error || "No se pudo registrar evento.");

      setLog(`Evento ✅ ${accion} | ${v} | ${rol}`, "ok");
      await refrescarEstado();
      await cargarCards(); // refresca lista
    }catch(e){
      setLog("Error: " + e.message, "err");
    }
  }

  async function refrescarEstado(){
    try{
      const v = normalizeVin(elVin.value);
      const rol = String(elRol.value||"").trim().toUpperCase();
      if (!VIN_OK || !v || !rol) return;

      const r = await gasRun("api_estado", { vin: v, rolTrabajo: rol });
      if (!r || r.ok === false) throw new Error(r?.error || "No pude obtener estado.");

      CONVERSION_ID = r.conversionId;

      if (r.estado === "TRABAJANDO" && r.running_since){
        // corregimos timer para que no “salte”
        stopTimer();
        UI_BASE_MS = Number(r.tiempo_ms)||0;
        UI_RUNNING_SINCE_MS = new Date(r.running_since).getTime();

        UI_TIMER = setInterval(() => {
          const extra = Date.now() - UI_RUNNING_SINCE_MS;
          elTimer.textContent = `Estado: TRABAJANDO | Tiempo: ${fmt(UI_BASE_MS + extra)}`;
        }, 500);
      }else{
        stopTimer();
        elTimer.textContent = `Estado: ${r.estado} | Tiempo: ${r.tiempo_hms || "00:00:00"}`;
      }

      setButtonsByEstado(r.estado);

    }catch(e){
      setLog("Error: " + e.message, "err");
    }
  }

  // ---------- CARDS ----------
  function badgeClass(estado){
    if (estado === "TRABAJANDO") return "ok";
    if (estado === "PAUSADO") return "err";
    return "";
  }

  async function cargarCards(){
    elCards.innerHTML = `<div class="small">Cargando...</div>`;
    try{
      const r = await gasRun("api_misActivas");
      if (!r || r.ok === false) throw new Error(r?.error || "api_misActivas falló.");

      const items = r.items || [];
      if (!items.length){
        elCards.innerHTML = `<div class="small">No tienes conversiones activas.</div>`;
        return;
      }

      elCards.innerHTML = items.map(i => {
        const vin = (i.vin || "").toUpperCase();
        const rol = (i.rolTrabajo || "").toUpperCase();
        const est = (i.estado || "SIN_INICIAR").toUpperCase();
        const t   = i.tiempo_hms || "00:00:00";

        return `
          <div class="card" style="max-width:none; margin: 8px 0;">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;">
              <div>
                <div style="font-weight:700;">${vin}</div>
                <div class="small">Rol: ${rol}</div>
              </div>
              <div class="small ${badgeClass(est)}" style="text-align:right;">
                <div>Estado: ${est}</div>
                <div>Tiempo: ${t}</div>
              </div>
            </div>
            <div class="grid" style="margin-top:10px;">
              <button type="button" onclick="abrirItem('${vin}','${rol}')">Abrir</button>
              <button type="button" onclick="refrescarItem('${vin}','${rol}')">Refrescar</button>
            </div>
          </div>
        `;
      }).join("");

    }catch(e){
      elCards.innerHTML = `<div class="small err">Error cargando activas: ${e.message}</div>`;
    }
  }

  // Expuestas al HTML (por onclick)
  window.abrirItem = async (vin, rol) => {
    elVin.value = vin;
    elRol.value = rol;
    VIN_OK = true;
    elEnsure.disabled = false;
    await asegurarConversion();
  };

  window.refrescarItem = async (vin, rol) => {
    elVin.value = vin;
    elRol.value = rol;
    VIN_OK = true;
    elEnsure.disabled = false;
    await asegurarConversion();
  };

  // ---------- QR ----------
  async function abrirCamara(){
    if (qr) return;

    elQrBox.style.display = "block";
    qr = new Html5Qrcode("qr-reader");

    try{
      await qr.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          const v = normalizeVin(decodedText);
          elVin.value = v;

          qr.stop().then(() => {
            qr = null;
            elQrBox.style.display = "none";
          });

          buscarVin();
        },
        (_err) => {}
      );
    }catch(e){
      setLog("No pude abrir cámara: " + e.message, "err");
      try{ await qr.stop(); }catch(_){}
      qr = null;
      elQrBox.style.display = "none";
    }
  }

  // ---------- EVENTS ----------
  elBuscar.addEventListener("click", buscarVin);
  elQR.addEventListener("click", abrirCamara);
  elEnsure.addEventListener("click", asegurarConversion);

  bInicio.addEventListener("click", () => enviarAccion("INICIO"));
  bPausa.addEventListener("click",  () => enviarAccion("PAUSA"));
  bRean.addEventListener("click",   () => enviarAccion("REANUDAR"));
  bFin.addEventListener("click",    () => enviarAccion("FIN"));

  elRol.addEventListener("change", () => {
    stopTimer();
    refrescarEstado();
  });

  // ---------- INIT ----------
  loadProfile();
  cargarCards();
  setInterval(cargarCards, 10000);
</script>
</body>
</html>
