<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <title>Registro GLP</title>

  <!-- PWA -->
  <meta name="application-name" content="Registro GLP" />
  <meta name="description" content="Sistema de registro y control de conversiones GLP" />
  <meta name="theme-color" content="#12161c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Registro GLP" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link rel="stylesheet" href="./public/styles.css" />
</head>

<body>
  <div id="appRoot"></div>

  <!-- Auto-recarga cuando el service worker se actualiza (nuevos deploys) -->
  <script>
    if ('serviceWorker' in navigator) {
      var _swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (_swRefreshing) return;
        _swRefreshing = true;
        window.location.reload();
      });
    }
  </script>

  <script src="/env-config.js"></script>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script type="module" src="./public/app.js"></script>
</body>
</html>
